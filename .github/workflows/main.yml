name: Testing
on:
  push:
    branches: main
    paths-ignore:
      - '.github/workflows/clang-formatter.yml'
      - 'project/discord-rpc/.clang-format'
      - 'LICENSE'
      - 'README.md'
      - 'haxelib.json'
      - 'hxformat.json'
  workflow_dispatch:
jobs:
  Job:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Dependencies
        shell: bash
        run: |
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git --quiet
          haxelib dev hxdiscord_rpc .
          cd "$(haxelib libpath hxcpp)/tools/hxcpp"
          haxe compile.hxml
          cd "${{ github.workspace }}"

      - name: Build Unix
        if: startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'ubuntu')
        run: cd sample && haxe build-unix.hxml

      - name: Build Windows
        if: startsWith(matrix.os, 'windows')
        run: cd sample && haxe build-win.hxml
